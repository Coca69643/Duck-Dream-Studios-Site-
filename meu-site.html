<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duck Dream Studios — Jogos Mobile Indie</title>
  <meta name="description" content="Hub oficial da Duck Dream Studios. Jogos mobile indie feitos com alma por Coca 69643." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes glow { 0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.2); } 50% { box-shadow: 0 0 50px rgba(255,215,0,0.55); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    @keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }

    /* HEADER */
    header {
      background: linear-gradient(180deg, #111122 0%, #0a0a0f 100%);
      border-bottom: 1px solid rgba(255,215,0,0.12);
      padding: 36px 20px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 500px; height: 250px;
      background: radial-gradient(ellipse, rgba(255,215,0,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .studio-logo {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 3px solid #ffd700;
      margin-bottom: 16px;
      animation: glow 3s infinite;
      position: relative;
    }
    .studio-name {
      font-size: 28px; font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 24px rgba(255,215,0,0.45);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .studio-tagline { font-size: 13px; color: #555; margin-bottom: 20px; }
    .stats { display: flex; gap: 20px; justify-content: center; align-items: center; }
    .stat { text-align: center; }
    .stat-num { font-size: 24px; font-weight: 800; color: #ffd700; }
    .stat-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    .stat-divider { width: 1px; height: 36px; background: #222; }

    /* MAIN */
    main { max-width: 900px; margin: 0 auto; padding: 0 16px 80px; }

    /* FEATURED */
    .featured-label {
      font-size: 11px; color: #ffd700; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      margin: 28px 0 10px;
    }
    .featured-card {
      display: flex; align-items: center; gap: 20;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 20px; padding: 22px;
      cursor: pointer;
      box-shadow: 0 4px 30px rgba(255,215,0,0.08);
      transition: all 0.25s;
      animation: fadeIn 0.4s ease;
    }
    .featured-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,215,0,0.18); border-color: rgba(255,215,0,0.5); }
    .featured-icon { width: 92px; height: 92px; border-radius: 16px; border: 2px solid #ffd700; flex-shrink: 0; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    .featured-title { font-size: 21px; font-weight: 800; margin-bottom: 7px; }
    .featured-desc { font-size: 13px; color: #999; line-height: 1.6; margin-bottom: 12px; }
    .featured-arrow { color: #ffd700; font-size: 22px; flex-shrink: 0; margin-left: auto; }

    /* FILTERS */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 28px 0 16px; }
    .filter-btn {
      background: rgba(255,255,255,0.05);
      color: #888; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 7px 16px;
      font-size: 12px; cursor: pointer; transition: all 0.2s;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #000; font-weight: 700; border: none;
    }
    .filter-btn:hover:not(.active) { border-color: rgba(255,215,0,0.3); color: #ccc; }

    /* GRID */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; }
    .game-card {
      background: linear-gradient(160deg, #131325, #171730);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; overflow: hidden;
      cursor: pointer; transition: all 0.25s;
      animation: fadeIn 0.3s ease both;
    }
    .game-card:hover { transform: translateY(-4px); border-color: rgba(255,215,0,0.35); box-shadow: 0 12px 40px rgba(255,215,0,0.1); }
    .card-cover {
      height: 115px;
      background: linear-gradient(135deg, #0f1a30, #1a1a2e);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .card-icon { width: 70px; height: 70px; border-radius: 13px; border: 2px solid rgba(255,215,0,0.3); }
    .card-emoji { font-size: 40px; }
    .status-badge {
      position: absolute; top: 10px; right: 10px;
      border-radius: 8px; padding: 2px 8px;
      font-size: 10px; font-weight: 700;
    }
    .card-body { padding: 14px 16px 16px; }
    .card-title { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
    .card-genre { font-size: 11px; color: #555; margin-bottom: 8px; }
    .card-desc { font-size: 12px; color: #888; line-height: 1.6; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
    .tag { background: rgba(255,215,0,0.06); color: #777; border-radius: 8px; padding: 2px 7px; font-size: 10px; }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 1000;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-sheet {
      background: linear-gradient(160deg, #14142a 0%, #0f1f3d 100%);
      border-radius: 24px 24px 0 0;
      width: 100%; max-width: 600px;
      max-height: 88vh; overflow-y: auto;
      padding: 28px;
      border: 1px solid rgba(255,215,0,0.2);
      animation: slideUp 0.28s ease;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 14px; }
    .modal-icon { width: 74px; height: 74px; border-radius: 14px; border: 2px solid #ffd700; flex-shrink: 0; }
    .modal-emoji-placeholder { width: 74px; height: 74px; border-radius: 14px; background: #1a1a3a; display: flex; align-items: center; justify-content: center; font-size: 34px; border: 2px solid #333; flex-shrink: 0; }
    .modal-title { font-size: 21px; font-weight: 800; margin-bottom: 4px; }
    .modal-sub { font-size: 12px; color: #666; margin-bottom: 8px; }
    .modal-close { background: rgba(255,255,255,0.08); border: none; color: #aaa; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .modal-desc { font-size: 14px; color: #bbb; line-height: 1.8; margin-bottom: 18px; }
    .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .modal-tag { background: rgba(255,215,0,0.08); color: #ffd700; border: 1px solid rgba(255,215,0,0.2); border-radius: 20px; padding: 4px 12px; font-size: 11px; }
    .dl-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, #ffd700, #ff9500);
      color: #000; font-weight: 800; padding: 14px; border-radius: 14px;
      text-decoration: none; font-size: 15px; width: 100%;
      transition: all 0.2s;
    }
    .dl-btn:hover { transform: scale(1.02); filter: brightness(1.08); }
    .no-dl { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 18px; text-align: center; color: #555; font-size: 13px; }

    /* FOOTER */
    footer { text-align: center; margin-top: 64px; padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.05); color: #333; font-size: 12px; line-height: 2.2; }
    footer img { width: 32px; border-radius: 50%; opacity: 0.25; display: block; margin: 0 auto 10px; }

    @media (max-width: 480px) {
      .studio-name { font-size: 22px; }
      .featured-card { flex-direction: column; text-align: center; }
      .featured-arrow { display: none; }
      .games-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    }
  </style>
</head>
<body>

<header>
  <img src="https://media.base44.com/images/public/69bb1be95290bb1c9a2c0426/149781da6_icon-512-lite.png" alt="Duck Dream Studios" class="studio-logo" />
  <div class="studio-name">🦆 Duck Dream Studios</div>
  <div class="studio-tagline">Jogos mobile indie feitos com alma — um pixel de cada vez</div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="total-games">5</div><div class="stat-label">Projetos</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num">1</div><div class="stat-label">Dev</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num" id="launched-games" style="color:#22c55e">0</div><div class="stat-label">Lançados</div></div>
  </div>
</header>

<main>
  <div class="featured-label">⭐ Projeto em Destaque</div>
  <div id="featured-container"></div>

  <div class="filters" id="filters"></div>
  <div class="games-grid" id="games-grid"></div>
</main>

<footer>
  <img src="https://media.base44.com/images/public/69bb1be95290bb1c9a2c0426/149781da6_icon-512-lite.png" alt="Duck" />
  🦆 Duck Dream Studios · Fundado por Coca 69643<br>
  Solo dev · Mobile first · Feito com ❤️ e Claude Sonnet
</footer>

<!-- MODAL -->
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<script>
const STATUS_COLORS = {
  "Em Desenvolvimento": "#f59e0b",
  "Beta": "#3b82f6",
  "Lançado": "#22c55e",
  "Em Breve": "#a855f7"
};
const STATUS_ICONS = {
  "Em Desenvolvimento": "🔧",
  "Beta": "🧪",
  "Lançado": "🚀",
  "Em Breve": "⏳"
};
const EMOJI = {
  "the-server-room": "💾",
  "terras-de-aldenmoor": "⚔️",
  "convergencia": "🌀",
  "catacumba": "💀"
};

const GAMES = [
  {
    id: 1, slug: "um-pato-e-um-sonho", featured: true,
    title: "Um Pato e um Sonho",
    genre: "Aventura / Pixel Art",
    status: "Em Desenvolvimento",
    platform: "Android",
    short_description: "A jornada de um patinho pixelado em busca do seu grande sonho.",
    description: "Um Pato e um Sonho é um jogo mobile com alma — siga a jornada de um pato pixelado determinado a realizar seu maior sonho. Com visual charming em pixel art e gameplay pensado para mobile, é o projeto-coração da Duck Dream Studios.",
    icon_image: "https://media.base44.com/images/public/69bb1be95290bb1c9a2c0426/149781da6_icon-512-lite.png",
    download_url: null,
    tags: ["pixel art", "aventura", "mobile", "indie"]
  },
  {
    id: 2, slug: "the-server-room", featured: false,
    title: "The Server Room",
    genre: "Suspense / Tech",
    status: "Em Desenvolvimento",
    platform: "Android",
    short_description: "Sobreviva ao caos digital dentro de uma sala de servidores.",
    description: "The Server Room é um projeto mobile da Duck Dream Studios com ambientação tecnológica e atmosfera tensa. Em desenvolvimento.",
    icon_image: null, download_url: null,
    tags: ["suspense", "tecnologia", "mobile", "indie"]
  },
  {
    id: 3, slug: "terras-de-aldenmoor", featured: false,
    title: "Terras de Aldenmoor",
    genre: "RPG / Fantasia",
    status: "Em Desenvolvimento",
    platform: "Android",
    short_description: "Explore as vastas terras de um mundo de fantasia épica.",
    description: "Terras de Aldenmoor é um RPG/aventura mobile ambientado em um universo de fantasia rico em lore. Projeto em estágio inicial pela Duck Dream Studios.",
    icon_image: null, download_url: null,
    tags: ["rpg", "fantasia", "aventura", "mobile", "indie"]
  },
  {
    id: 4, slug: "convergencia", featured: false,
    title: "Convergência",
    genre: "Ficção Científica",
    status: "Em Desenvolvimento",
    platform: "Android",
    short_description: "Quando mundos colidem, apenas um pode prevalecer.",
    description: "Convergência é um projeto mobile misterioso da Duck Dream Studios que explora o encontro de universos paralelos. Em desenvolvimento.",
    icon_image: null, download_url: null,
    tags: ["sci-fi", "mistério", "mobile", "indie"]
  },
  {
    id: 5, slug: "catacumba", featured: false,
    title: "Catacumba",
    genre: "Dungeon / Survival",
    status: "Em Desenvolvimento",
    platform: "Android",
    short_description: "Desça fundo. Sobreviva ao que habita nas profundezas.",
    description: "Catacumba é um jogo mobile de dungeon/survival da Duck Dream Studios com atmosfera sombria e gameplay desafiador. Em desenvolvimento.",
    icon_image: null, download_url: null,
    tags: ["dungeon", "survival", "horror", "mobile", "indie"]
  }
];

let currentFilter = "Todos";

function statusBadge(status) {
  const c = STATUS_COLORS[status] || "#888";
  return `<span class="status-badge" style="background:${c}22;color:${c};border:1px solid ${c}44">${STATUS_ICONS[status]||""} ${status}</span>`;
}

function iconOrEmoji(game, size) {
  if (game.icon_image) return `<img src="${game.icon_image}" alt="${game.title}" style="width:${size}px;height:${size}px;border-radius:${size*0.18}px;border:2px solid rgba(255,215,0,0.35)">`;
  return `<span style="font-size:${size*0.5}px">${EMOJI[game.slug]||"🎮"}</span>`;
}

function renderFeatured() {
  const f = GAMES.find(g => g.featured);
  if (!f) return;
  document.getElementById("featured-container").innerHTML = `
    <div class="featured-card" onclick="openModal(${f.id})">
      ${f.icon_image ? `<img src="${f.icon_image}" class="featured-icon" alt="${f.title}">` : `<div style="width:92px;height:92px;border-radius:16px;background:#1a1a3a;display:flex;align-items:center;justify-content:center;font-size:44px;flex-shrink:0">${EMOJI[f.slug]||"🎮"}</div>`}
      <div style="flex:1">
        <div class="featured-title">${f.title}</div>
        <div class="featured-desc">${f.short_description}</div>
        <div class="tags">${f.tags.map(t=>`<span class="tag" style="background:rgba(255,215,0,0.1);color:#ffd700;border:1px solid rgba(255,215,0,0.2)">${t}</span>`).join("")}</div>
      </div>
      <div class="featured-arrow">›</div>
    </div>`;
}

function renderFilters() {
  const genres = ["Todos", ...new Set(GAMES.map(g => g.genre))];
  document.getElementById("filters").innerHTML = genres.map(g =>
    `<button class="filter-btn${currentFilter===g?" active":""}" onclick="setFilter('${g}')">${g}</button>`
  ).join("");
}

function renderGrid() {
  const list = currentFilter === "Todos" ? GAMES : GAMES.filter(g => g.genre === currentFilter);
  document.getElementById("games-grid").innerHTML = list.map((g, i) => `
    <div class="game-card" style="animation-delay:${i*0.06}s" onclick="openModal(${g.id})">
      <div class="card-cover">
        ${g.icon_image ? `<img src="${g.icon_image}" class="card-icon" alt="${g.title}">` : `<div class="card-emoji">${EMOJI[g.slug]||"🎮"}</div>`}
        ${statusBadge(g.status)}
      </div>
      <div class="card-body">
        <div class="card-title">${g.title}</div>
        <div class="card-genre">${g.genre}</div>
        <div class="card-desc">${g.short_description}</div>
        <div class="tags">${g.tags.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
    </div>`).join("");
}

function setFilter(f) {
  currentFilter = f;
  renderFilters();
  renderGrid();
}

function openModal(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) return;
  const c = STATUS_COLORS[g.status] || "#888";
  document.getElementById("modal-sheet").innerHTML = `
    <div class="modal-header">
      <div style="display:flex;gap:14px;align-items:center">
        ${g.icon_image ? `<img src="${g.icon_image}" class="modal-icon" alt="${g.title}">` : `<div class="modal-emoji-placeholder">${EMOJI[g.slug]||"🎮"}</div>`}
        <div>
          <div class="modal-title">${g.title}</div>
          <div class="modal-sub">${g.genre} · ${g.platform||"Android"}</div>
          <span class="status-badge" style="position:static;display:inline-block;margin-top:4px;background:${c}22;color:${c};border:1px solid ${c}55;border-radius:20px;padding:3px 10px">${STATUS_ICONS[g.status]||""} ${g.status}</span>
        </div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-desc">${g.description}</div>
    <div class="modal-tags">${g.tags.map(t=>`<span class="modal-tag">${t}</span>`).join("")}</div>
    ${g.download_url
      ? `<a href="${g.download_url}" class="dl-btn" target="_blank">⬇️ Baixar APK</a>`
      : `<div class="no-dl">🔧 Em desenvolvimento — em breve disponível para download!</div>`}`;
  document.getElementById("modal").style.display = "flex";
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// Init
renderFeatured();
renderFilters();
renderGrid();
document.getElementById("total-games").textContent = GAMES.length;
document.getElementById("launched-games").textContent = GAMES.filter(g => g.status === "Lançado").length || "—";
</script>
</body>
</html>
